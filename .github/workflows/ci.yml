name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      # Pull the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Generate Prisma client
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run type check
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # Pull the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Generate Prisma client
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run lint
        run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      # Pull the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run format check
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # Pull the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Generate Prisma client
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: url_shortener
          POSTGRES_PASSWORD: url_shortener
          POSTGRES_DB: url_shortener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U url_shortener"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://url_shortener:url_shortener@localhost:5432/url_shortener_test?schema=public
    steps:
      # Pull the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Generate Prisma client
      - name: Generate Prisma client
        run: npx prisma generate

      # Apply migrations so the AppModule can connect to the schema on boot
      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run E2E tests
        run: npm run test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Pull the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Generate Prisma client
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build project
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: url_shortener
          POSTGRES_PASSWORD: url_shortener
          POSTGRES_DB: url_shortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U url_shortener"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://url_shortener:url_shortener@localhost:5432/url_shortener?schema=public
    steps:
      # Pull the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Validate the three compose files (syntax, profiles and variable interpolation)
      - name: Validate compose files
        run: |
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.test.yml config -q

      # Build the image that docker-compose.prod.yml ships
      - name: Build production image
        run: docker build --target prod -t url-shortener:ci .

      # The prod compose applies migrations with the `base` target, so exercise that path too
      - name: Build migrate image and apply migrations
        run: |
          docker build --target base -t url-shortener:migrate .
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            url-shortener:migrate npx prisma migrate deploy

      # Start the packaged image and make a request that hits the database
      - name: Smoke test production image
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL="$DATABASE_URL" -e PORT=3000 \
            url-shortener:ci
          trap 'docker logs app || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS -X POST http://localhost:3000/api/urls \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com"}'
